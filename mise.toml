min_version = "2026.8.6"

[tools]
actionlint = "1.7.12"
deno = "2.9.5"
hk = "1.55.0"
node = "24.12.0"
taplo = "0.10.0"
"github:archetect/archetect" = "3.4.3"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tool_config]
locked = true

[tasks.check]
description = "Check the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk check "$@"
fi
hk check --all
exec mise run release-action:check
'''

[tasks.fix]
description = "Fix the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk fix "$@"
fi
hk fix --all
exec mise run release-action:fix
'''

[tasks."release-action:install"]
hide = true
dir = ".github/actions/release"
sources = ["package-lock.json", "package.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci --ignore-scripts"

[tasks."release-action:check"]
description = "Check the bundled release action"
depends = ["release-action:install"]
dir = ".github/actions/release"
run = "npm run check"

[tasks."release-action:fix"]
description = "Rebuild the bundled release action"
depends = ["release-action:install"]
dir = ".github/actions/release"
run = "npm run fix"

[tasks."release-action:test"]
description = "Test the bundled release action"
depends = ["release-action:install"]
dir = ".github/actions/release"
run = "npm test"

[tasks.generate]
description = "Render a repository with Archetect"
run = "archetect render ."

[tasks.test]
description = "Run all reproducible checks and generation tests"
depends = ["check"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
deno run --allow-env=REPOSITORY_TEMPLATE_ARCHETECT,REPOSITORY_TEMPLATE_MISE --allow-read --allow-run=archetect,git,mise --allow-write scripts/test_generate.ts
mise run release-action:test
'''
