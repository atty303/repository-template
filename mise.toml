min_version = "2026.8.6"

[tools]
actionlint = "1.7.12"
deno = "2.9.5"
hk = "1.55.0"
taplo = "0.10.0"
"github:cargo-generate/cargo-generate" = "0.23.14"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tool_config]
locked = true

[tasks.check]
description = "Check the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk check "$@"
fi
exec hk check --all
'''

[tasks.fix]
description = "Fix the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk fix "$@"
fi
exec hk fix --all
'''

[tasks.generate]
description = "Generate a repository without prompts"
run = "deno run --allow-read --allow-run=cargo-generate --allow-write scripts/generate.ts"

[tasks."generate:interactive"]
description = "Generate a repository interactively"
run = "cargo-generate generate --path ."

[tasks.sync]
description = "Synchronize common files into both templates"
run = "deno run --allow-read --allow-write scripts/sync_shared.ts sync"

[tasks."sync:check"]
description = "Check that both templates contain the common files"
run = "deno run --allow-read scripts/sync_shared.ts check"

[tasks.test]
description = "Run all reproducible checks and generation tests"
depends = ["check", "sync:check"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
deno test --allow-read --allow-write scripts
deno run --allow-env=REPOSITORY_TEMPLATE_MISE --allow-read --allow-run --allow-write scripts/test_generate.ts
'''
